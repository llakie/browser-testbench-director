<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Beispiel-Website</title>
        <style>
            :root {
                color-scheme: light;
                font-family: Inter, system-ui, sans-serif;
                background: #f4f1e9;
                color: #20242d;
            }
            body {
                display: grid;
                min-height: 100vh;
                margin: 0;
                place-items: center;
                background: linear-gradient(145deg, #fffaf0, #e4eaf4);
            }
            main {
                width: min(78vw, 34rem);
                padding: 2rem;
                border: 1px solid #cbd1dc;
                border-radius: 1rem;
                background: rgba(255, 255, 255, 0.86);
                box-shadow: 0 1.5rem 4rem rgba(37, 43, 55, 0.14);
            }
            small {
                color: #697386;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
            h1 {
                margin: 0.5rem 0;
                font-size: clamp(2rem, 7vw, 4rem);
                line-height: 0.95;
            }
            p {
                margin: 1rem 0 0;
                color: #596171;
                line-height: 1.55;
            }
        </style>
    </head>
    <body>
        <main id="example-website">
            <small>Browser Testbench</small>
            <h1>Beispiel-Website</h1>
            <p>Diese Seite liegt unter dem ausgewählten Layer.</p>
        </main>
    </body>
</html>
