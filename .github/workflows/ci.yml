name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run licenses:check
            - run: npm run format:check
            - run: npm run verify:core
            - if: runner.os == 'Linux'
              run: npm run verify:package
