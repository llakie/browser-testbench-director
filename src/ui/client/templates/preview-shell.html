<!doctype html>
<html lang="en" class="notranslate" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="google" content="notranslate" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            :root {
                color-scheme: dark;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: /* director:page-background */;
            }
            .director-website {
                position: fixed;
                inset: 0;
                z-index: 0;
                display: block;
                width: 100%;
                height: 100%;
                border: 0;
                background: #fff;
            }
            .director-layer {
                position: fixed;
                inset: 0;
                z-index: 10;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                pointer-events: none;
            }
            .director-layer__anchor {
                position: fixed;
                display: grid;
                pointer-events: none;
            }
            .director-layer__anchor[data-horizontal='left'] {
                justify-items: start;
            }
            .director-layer__anchor[data-horizontal='center'] {
                justify-items: center;
            }
            .director-layer__anchor[data-horizontal='right'] {
                justify-items: end;
            }
            .director-layer__anchor[data-vertical='top'] {
                align-items: start;
            }
            .director-layer__anchor[data-vertical='center'] {
                align-items: center;
            }
            .director-layer__anchor[data-vertical='bottom'] {
                align-items: end;
            }
            .director-layer__content {
                position: relative;
                max-width: 100vw;
                max-height: 100vh;
            }
            .preview-error {
                position: fixed;
                right: 1rem;
                bottom: 1rem;
                left: 1rem;
                z-index: 999999;
                max-height: 35%;
                overflow: auto;
                margin: 0;
                padding: 0.75rem;
                border: 1px solid #ff6b73;
                border-radius: 0.5rem;
                background: #2b1015;
                color: #ffd9dc;
                font:
                    12px/1.45 ui-monospace,
                    monospace;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <!-- director:website -->
        <div id="director-overlays"></div>
        <script>
            /* director:runtime */
        </script>
    </body>
</html>
