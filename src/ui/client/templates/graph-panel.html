<template>
    <section class="panel graph-panel" :aria-label="t('graph.title')">
        <header class="panel__header">
            <div class="panel-header-actions">
                <node-add-menu
                    :open="nodeMenuOpen"
                    :category="nodeMenuCategory"
                    :disabled="executionRunning"
                    :video-output-available="!project.nodes.some(node => node.type === 'video-output')"
                    :screenshot-output-available="!project.nodes.some(node => node.type === 'screenshot-output')"
                    @toggle="toggleNodeMenu"
                    @close="nodeMenuOpen = false"
                    @update:category="nodeMenuCategory = $event"
                    @add="addNode"
                ></node-add-menu>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="duplicate-node"
                    :disabled="!canDuplicateActiveNode || executionRunning"
                    :aria-label="t('node.duplicate')"
                    :title="t('node.duplicate')"
                    @click="duplicateActiveNode"
                >
                    <span class="bi bi-copy" aria-hidden="true"></span>
                </button>
                <button
                    v-if="activeConnectionId"
                    class="icon-button"
                    type="button"
                    data-testid="delete-connection"
                    :disabled="executionRunning"
                    :aria-label="t('graph.deleteConnection')"
                    :title="t('graph.deleteConnection')"
                    @click="deleteConnection()"
                >
                    <span class="bi bi-trash3" aria-hidden="true"></span>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="auto-layout-graph"
                    :disabled="executionRunning || graphLayoutRunning"
                    :aria-label="t('graph.autoLayout')"
                    :title="t('graph.autoLayout')"
                    @click="autoLayoutGraph"
                >
                    <span class="bi bi-diagram-3" aria-hidden="true"></span>
                </button>
                <div class="zoom-control" :aria-label="t('zoom.graph')">
                    <button
                        type="button"
                        data-testid="graph-zoom-out"
                        :aria-label="t('zoom.out')"
                        @click="changeGraphZoom(-0.25)"
                    >
                        −
                    </button>
                    <button
                        type="button"
                        data-testid="graph-zoom-reset"
                        :aria-label="t('zoom.reset')"
                        @click="resetGraphZoom"
                    >
                        {{ graphZoomPercent }} %
                    </button>
                    <button
                        type="button"
                        data-testid="graph-zoom-in"
                        :aria-label="t('zoom.in')"
                        @click="changeGraphZoom(0.25)"
                    >
                        +
                    </button>
                </div>
                <button
                    v-if="!recordingActive"
                    :class="[
                                'icon-button',
                                workflowPlaybackRunning ? 'execution-stop' : 'workflow-play',
                            ]"
                    type="button"
                    :data-testid="workflowPlaybackRunning ? 'stop-workflow' : 'play-workflow'"
                    :disabled="workflowStartPending || (browserTargetOpening && !executionRunning)"
                    :aria-label="t(workflowPlaybackRunning ? 'playback.stop' : 'playback.workflow')"
                    :title="t(workflowPlaybackRunning ? 'playback.stop' : 'playback.workflow')"
                    @click="workflowPlaybackRunning ? stopPlayback() : playWorkflow()"
                >
                    <span
                        :class="['bi', workflowPlaybackRunning ? 'bi-stop-fill' : 'bi-play-fill']"
                        aria-hidden="true"
                    ></span>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="maximize-graph"
                    :aria-label="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                    :title="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                    @click="togglePanelMaximized('graph')"
                >
                    <span
                        :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'graph' }]"
                        aria-hidden="true"
                        ><span></span><span></span><span></span><span></span
                    ></span>
                </button>
            </div>
        </header>
        <div
            data-workspace-ref="graph"
            class="graph-canvas"
            data-testid="graph-canvas"
            @pointerdown.capture="startStageGesture"
            @pointermove.capture="moveStageGesture"
            @pointerup.capture="endStageGesture"
            @pointercancel.capture="endStageGesture"
            @wheel="zoomFromWheel"
            @dblclick="resetGraphZoom"
            @contextmenu.prevent
        ></div>
    </section>
</template>
