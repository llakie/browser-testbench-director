<template>
    <section class="panel graph-panel" :aria-label="t('graph.title')">
        <header class="panel__header">
            <div class="panel-header-actions">
                <div
                    data-workspace-ref="nodeFlyout"
                    class="action-flyout"
                    @keydown.esc.stop.prevent="nodeMenuCategory ? nodeMenuCategory = '' : nodeMenuOpen = false"
                >
                    <button
                        class="icon-button"
                        type="button"
                        data-testid="node-actions-trigger"
                        :disabled="executionRunning"
                        :aria-label="t('node.actions')"
                        :title="t('node.actions')"
                        aria-haspopup="menu"
                        :aria-expanded="String(nodeMenuOpen)"
                        @click="toggleNodeMenu"
                    >
                        <span class="bi bi-plus-lg" aria-hidden="true"></span>
                    </button>
                    <div v-if="nodeMenuOpen" class="flyout-menu action-flyout__menu" role="menu">
                        <template v-if="!nodeMenuCategory">
                            <button
                                v-for="category in ['inputs', 'layers', 'browser', 'flow']"
                                :key="category"
                                class="action-option action-option--category"
                                type="button"
                                role="menuitem"
                                :data-testid="`node-category-${category}`"
                                @click="nodeMenuCategory = category"
                            >
                                <span
                                    :class="['bi', { inputs: 'bi-box-arrow-in-right', layers: 'bi-layers', browser: 'bi-cursor', flow: 'bi-diagram-3' }[category]]"
                                    aria-hidden="true"
                                ></span>
                                <span>{{ t(`node.category.${category}`) }}</span>
                                <span class="bi bi-chevron-right" aria-hidden="true"></span>
                            </button>
                        </template>
                        <template v-else>
                            <button
                                class="action-option action-option--back"
                                type="button"
                                role="menuitem"
                                data-testid="node-category-back"
                                @click="nodeMenuCategory = ''"
                            >
                                <span class="bi bi-chevron-left" aria-hidden="true"></span>
                                <span>{{ t(`node.category.${nodeMenuCategory}`) }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'inputs'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-input-node"
                                @click="addNode('input')"
                            >
                                <span class="bi bi-file-earmark-arrow-up" aria-hidden="true"></span>
                                <span>{{ t('node.addInput') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'inputs'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-camera-capability-node"
                                @click="addNode('camera-capability')"
                            >
                                <span class="bi bi-camera-video" aria-hidden="true"></span>
                                <span>{{ t('node.addCameraCapability') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'layers'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-layer-node"
                                @click="addNode('layer')"
                            >
                                <span class="bi bi-layers" aria-hidden="true"></span>
                                <span>{{ t('node.addLayer') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'layers'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-text-layer-node"
                                @click="addNode('text-layer')"
                            >
                                <span class="bi bi-fonts" aria-hidden="true"></span>
                                <span>{{ t('node.addTextLayer') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'browser'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-javascript-node"
                                @click="addNode('javascript')"
                            >
                                <span class="bi bi-braces" aria-hidden="true"></span>
                                <span>{{ t('node.addJavaScript') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'browser'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-browser-action-node"
                                @click="addNode('browser-action')"
                            >
                                <span class="bi bi-cursor" aria-hidden="true"></span>
                                <span>{{ t('node.addBrowserAction') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'browser'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-browser-wait-node"
                                @click="addNode('browser-wait')"
                            >
                                <span class="bi bi-hourglass-split" aria-hidden="true"></span>
                                <span>{{ t('node.addBrowserWait') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'flow'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-merge-node"
                                @click="addNode('merge')"
                            >
                                <span class="bi bi-sign-merge-right" aria-hidden="true"></span>
                                <span>{{ t('node.addMerge') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'layers'"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-audio-node"
                                @click="addNode('audio')"
                            >
                                <span class="bi bi-volume-up" aria-hidden="true"></span>
                                <span>{{ t('node.addAudio') }}</span>
                            </button>
                            <button
                                v-if="nodeMenuCategory === 'flow' && !project.nodes.some(node => node.type === 'video-output')"
                                class="action-option"
                                type="button"
                                role="menuitem"
                                data-testid="add-video-output-node"
                                @click="addNode('video-output')"
                            >
                                <span class="bi bi-camera-reels" aria-hidden="true"></span>
                                <span>{{ t('node.addVideoOutput') }}</span>
                            </button>
                        </template>
                    </div>
                </div>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="duplicate-node"
                    :disabled="!canDuplicateActiveNode || executionRunning"
                    :aria-label="t('node.duplicate')"
                    :title="t('node.duplicate')"
                    @click="duplicateActiveNode"
                >
                    <span class="bi bi-copy" aria-hidden="true"></span>
                </button>
                <button
                    v-if="activeConnectionId"
                    class="icon-button"
                    type="button"
                    data-testid="delete-connection"
                    :disabled="executionRunning"
                    :aria-label="t('graph.deleteConnection')"
                    :title="t('graph.deleteConnection')"
                    @click="deleteConnection()"
                >
                    <span class="bi bi-trash3" aria-hidden="true"></span>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="auto-layout-graph"
                    :disabled="executionRunning || graphLayoutRunning"
                    :aria-label="t('graph.autoLayout')"
                    :title="t('graph.autoLayout')"
                    @click="autoLayoutGraph"
                >
                    <span class="bi bi-diagram-3" aria-hidden="true"></span>
                </button>
                <div class="zoom-control" :aria-label="t('zoom.graph')">
                    <button
                        type="button"
                        data-testid="graph-zoom-out"
                        :aria-label="t('zoom.out')"
                        @click="changeGraphZoom(-0.25)"
                    >
                        −
                    </button>
                    <button
                        type="button"
                        data-testid="graph-zoom-reset"
                        :aria-label="t('zoom.reset')"
                        @click="resetGraphZoom"
                    >
                        {{ graphZoomPercent }} %
                    </button>
                    <button
                        type="button"
                        data-testid="graph-zoom-in"
                        :aria-label="t('zoom.in')"
                        @click="changeGraphZoom(0.25)"
                    >
                        +
                    </button>
                </div>
                <button
                    v-if="!recordingActive"
                    :class="[
                                'icon-button',
                                executionRunning ? 'execution-stop' : 'workflow-play',
                            ]"
                    type="button"
                    :data-testid="executionRunning ? 'stop-workflow' : 'play-workflow'"
                    :disabled="browserTargetOpening && !executionRunning"
                    :aria-label="t(executionRunning ? 'playback.stop' : 'playback.workflow')"
                    :title="t(executionRunning ? 'playback.stop' : 'playback.workflow')"
                    @click="executionRunning ? stopPlayback() : playWorkflow()"
                >
                    <span
                        :class="['bi', executionRunning ? 'bi-stop-fill' : 'bi-play-fill']"
                        aria-hidden="true"
                    ></span>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="maximize-graph"
                    :aria-label="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                    :title="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                    @click="togglePanelMaximized('graph')"
                >
                    <span
                        :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'graph' }]"
                        aria-hidden="true"
                        ><span></span><span></span><span></span><span></span
                    ></span>
                </button>
            </div>
        </header>
        <div
            data-workspace-ref="graph"
            class="graph-canvas"
            data-testid="graph-canvas"
            @pointerdown.capture="startStageGesture('graph', $event)"
            @pointermove.capture="moveStageGesture('graph', $event)"
            @pointerup.capture="endStageGesture('graph', $event)"
            @pointercancel.capture="endStageGesture('graph', $event)"
            @wheel="zoomFromWheel('graph', $event)"
            @dblclick="resetGraphZoom"
            @contextmenu.prevent
        ></div>
    </section>
</template>
