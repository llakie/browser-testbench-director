<template>
    <modal-dialog
        :open="projectSettingsOpen"
        :title="t('project.settings')"
        :description="t('browserSession.intro')"
        :close-label="t('project.closeSettings')"
        panel-class="project-settings-dialog"
        title-id="project-settings-title"
        test-id="project-settings-backdrop"
        close-test-id="close-project-settings"
        @cancel="closeProjectSettings"
    >
        <div class="project-settings-dialog__content" @pointerdown="closeProjectPermissions">
            <div class="project-settings-group">
                <strong>{{ t('browserSession.title') }}</strong>
                <div class="project-settings-fields">
                    <property-field :label="t('browserSession.language')">
                        <input
                            :value="browserSession.language"
                            type="text"
                            list="browser-language-options"
                            data-testid="browser-session-language"
                            :placeholder="t('browserSession.languagePlaceholder')"
                            spellcheck="false"
                            @input="updateBrowserSessionSetting('language', $event)"
                        />
                        <datalist id="browser-language-options">
                            <option value="de"></option>
                            <option value="en"></option>
                            <option value="es"></option>
                            <option value="fr"></option>
                            <option value="it"></option>
                            <option value="nl"></option>
                            <option value="pl"></option>
                            <option value="pt"></option>
                        </datalist>
                    </property-field>
                    <property-field :label="t('browserSession.locale')">
                        <input
                            :value="browserSession.locale"
                            type="text"
                            list="browser-locale-options"
                            data-testid="browser-session-locale"
                            :placeholder="t('browserSession.localePlaceholder')"
                            spellcheck="false"
                            @input="updateBrowserSessionSetting('locale', $event)"
                        />
                        <datalist id="browser-locale-options">
                            <option value="DE"></option>
                            <option value="US"></option>
                            <option value="GB"></option>
                            <option value="ES"></option>
                            <option value="FR"></option>
                            <option value="IT"></option>
                            <option value="NL"></option>
                            <option value="PL"></option>
                            <option value="PT"></option>
                        </datalist>
                    </property-field>
                </div>
                <p>{{ t('browserSession.languageHint') }}</p>
                <div class="project-settings-permissions">
                    <span>{{ t('browserSession.permissions') }}</span>
                    <div
                        data-workspace-ref="projectPermissions"
                        class="permission-select flyout-host"
                        @pointerdown.stop
                    >
                        <button
                            class="permission-select__trigger"
                            type="button"
                            data-testid="browser-session-permissions"
                            data-flyout-trigger
                            :aria-expanded="String(projectPermissionsOpen)"
                            aria-controls="browser-session-permission-options"
                            @click="toggleProjectPermissions"
                        >
                            <span>{{ browserPermissionSummary }}</span>
                            <i class="bi bi-chevron-down" aria-hidden="true"></i>
                        </button>
                        <teleport to="body">
                            <div
                                v-if="projectPermissionsOpen"
                                class="flyout-portal flyout-host"
                                data-flyout-global
                                data-flyout-owner="projectPermissions"
                                data-flyout-anchor-selector='[data-testid="browser-session-permissions"]'
                                data-flyout-preferred-placement="above"
                                data-flyout-placement="above"
                            >
                                <div
                                    id="browser-session-permission-options"
                                    class="flyout-menu permission-select__menu"
                                    role="listbox"
                                    aria-multiselectable="true"
                                    @keydown.esc.stop.prevent="closeProjectPermissions"
                                >
                                    <toggle-control
                                        v-for="permission in browserPermissions"
                                        :key="permission"
                                        :model-value="browserSession.permissions.includes(permission)"
                                        :label="t(`browserSession.${permission}`)"
                                        :value="permission"
                                        :test-id="`browser-session-permission-${permission}`"
                                        @change="setBrowserPermission(permission, $event)"
                                    ></toggle-control>
                                </div>
                            </div>
                        </teleport>
                    </div>
                    <p>{{ t('browserSession.permissionsHint') }}</p>
                </div>
            </div>
        </div>
    </modal-dialog>
</template>
