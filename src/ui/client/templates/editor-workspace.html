<template>
    <div class="director-shell">
        <header :class="['topbar', { 'topbar--recording': recordingActive }]">
            <div class="brand">
                <span class="brand__mark" aria-hidden="true"><span></span></span>
                <span class="brand__copy">
                    <small>{{ t('product.eyebrow') }}</small>
                    <strong>{{ t('product.name') }}</strong>
                </span>
            </div>

            <div class="project-title">
                <label class="visually-hidden" for="project-name"
                    >{{ t('project.localHint') }}</label
                >
                <input id="project-name" v-model="project.name" type="text" @input="markDirty" />
                <button
                    v-if="recordingActive"
                    class="recording-status"
                    type="button"
                    data-testid="recording-status"
                    :aria-label="t('recording.stop')"
                    :title="t('recording.stop')"
                    @click="stopRecordingWorkflow"
                >
                    <span class="recording-status__dot" aria-hidden="true"></span>
                    <span class="recording-status__label">{{ t('recording.active') }}</span>
                    <span aria-hidden="true">·</span>
                    <time>{{ recordingElapsedLabel }}</time>
                    <i class="bi bi-stop-fill" aria-hidden="true"></i>
                </button>
                <small v-else>
                    <span :class="['status-dot', { 'is-dirty': dirty }]" aria-hidden="true"></span>
                    {{ dirty ? t('status.unsaved') : t('status.saved') }}
                </small>
            </div>

            <nav class="file-actions" :aria-label="t('project.localHint')">
                <button
                    class="button button--quiet mcp-setup-button"
                    type="button"
                    data-testid="open-mcp-setup"
                    :aria-label="t('mcp.setup')"
                    :title="t('mcp.setup')"
                    @click="openMcpSetup"
                >
                    <i class="bi bi-robot" aria-hidden="true"></i>
                    <span class="mcp-setup-label">{{ t('mcp.setup') }}</span>
                </button>
                <button
                    :class="[
                        'icon-button',
                        'testbench-power',
                        { 'is-running': browserTestbenchRunning },
                    ]"
                    type="button"
                    data-testid="toggle-browser-testbench"
                    :disabled="browserTestbenchTransitioning || executionRunning"
                    :aria-label="browserTestbenchLifecycleLabel"
                    :title="browserTestbenchLifecycleLabel"
                    @click="toggleBrowserTestbench"
                >
                    <span class="bi bi-flask-fill" aria-hidden="true"></span>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="new-project"
                    :aria-label="t('project.new')"
                    :title="t('project.new')"
                    @click="newProject"
                >
                    <i class="bi bi-file-earmark-plus" aria-hidden="true"></i>
                </button>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="open-project"
                    :aria-label="t('project.open')"
                    :title="t('project.open')"
                    @click="openProject"
                >
                    <i class="bi bi-folder2-open" aria-hidden="true"></i>
                </button>
                <button
                    class="icon-button icon-button--primary"
                    type="button"
                    data-testid="save-project"
                    :disabled="savingProject"
                    :aria-busy="String(savingProject)"
                    :aria-label="t('project.save')"
                    :title="t('project.save')"
                    @click="saveProject"
                >
                    <i
                        :class="[
                            'bi',
                            savingProject ? 'bi-arrow-repeat icon-spinner' : 'bi-floppy',
                        ]"
                        aria-hidden="true"
                    ></i>
                </button>
            </nav>
            <input
                ref="projectFileInput"
                class="visually-hidden"
                data-testid="project-file-input"
                type="file"
                accept=".json,.btd.json,application/json"
                @change="loadProject"
            />
        </header>

        <main
            ref="workspace"
            :class="[
                'workspace',
                `workspace--${previewOrientation}`,
                {
                    'workspace--panel-maximized': maximizedPanel,
                    [`workspace--maximized-${maximizedPanel}`]: maximizedPanel,
                    [`workspace--mobile-${mobileActivePanel}`]: true,
                },
            ]"
            :style="workspaceStyle"
        >
            <nav
                class="mobile-workspace-tabs"
                role="tablist"
                :aria-label="t('workspace.mobileViews')"
            >
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-graph-tab"
                    :class="{ 'is-active': mobileActivePanel === 'graph' }"
                    :aria-selected="String(mobileActivePanel === 'graph')"
                    @click="setMobilePanel('graph')"
                >
                    {{ t('graph.title') }}
                </button>
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-editor-tab"
                    :class="{ 'is-active': mobileActivePanel === 'editor' }"
                    :aria-selected="String(mobileActivePanel === 'editor')"
                    @click="setMobilePanel('editor')"
                >
                    {{ editorPanelTitle }}
                </button>
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-preview-tab"
                    :class="{ 'is-active': mobileActivePanel === 'preview' }"
                    :aria-selected="String(mobileActivePanel === 'preview')"
                    @click="setMobilePanel('preview')"
                >
                    {{ t('preview.title') }}
                </button>
            </nav>

            <section class="panel preview-panel" :aria-label="t('preview.title')">
                <header class="panel__header panel__header--preview">
                    <div class="preview-toolbar">
                        <div
                            ref="deviceFlyout"
                            class="device-flyout"
                            @keydown.esc.stop.prevent="deviceMenuOpen = false"
                        >
                            <span class="toolbar-control-label"
                                >{{ t('preview.destination') }}</span
                            >
                            <button
                                class="viewport-label viewport-selector"
                                type="button"
                                data-testid="viewport-device-trigger"
                                :aria-label="t('preview.deviceChoice', { device: previewDestinationLabel })"
                                :title="t('preview.deviceChoice', { device: previewDestinationLabel })"
                                aria-haspopup="menu"
                                :aria-expanded="String(deviceMenuOpen)"
                                @click="toggleDeviceMenu"
                            >
                                <span :class="['bi', viewportPresetIcon]" aria-hidden="true"></span>
                                <span data-testid="viewport-scale">{{ viewportLabel }}</span>
                            </button>
                            <div
                                v-if="deviceMenuOpen"
                                class="flyout-menu device-flyout__menu"
                                role="menu"
                            >
                                <button
                                    v-for="preset in viewportPresets"
                                    :key="preset.id"
                                    :class="[
                                        'device-option',
                                        { 'is-active': currentViewportPreset?.id === preset.id },
                                    ]"
                                    type="button"
                                    role="menuitemradio"
                                    :data-testid="`viewport-device-${preset.id}`"
                                    :aria-checked="String(currentViewportPreset?.id === preset.id)"
                                    @click="selectViewportPreset(preset)"
                                >
                                    <span :class="['bi', preset.icon]" aria-hidden="true"></span>
                                    <span class="device-option__content">
                                        <span>{{ t(preset.labelKey) }}</span>
                                        <small>
                                            {{ preset.viewport.width }} × {{ preset.viewport.height
                                            }} CSS · {{ preset.output.width }} × {{
                                            preset.output.height }} Video
                                        </small>
                                    </span>
                                </button>
                                <div v-if="browserTestbenchRunning" class="device-menu-section">
                                    <span class="device-menu-section__label"
                                        >{{ t('preview.remoteTargets') }}</span
                                    >
                                    <button
                                        v-for="target in compatiblePreviewTargets"
                                        :key="target.id"
                                        :class="[
                                            'target-option',
                                            { 'is-active': selectedBrowserTargetId === target.id },
                                        ]"
                                        type="button"
                                        role="menuitemradio"
                                        :data-testid="`remote-target-${target.id}`"
                                        :aria-checked="String(selectedBrowserTargetId === target.id)"
                                        :disabled="!target.ready || target.busy"
                                        @click="selectRemotePreviewTarget(target)"
                                    >
                                        <i
                                            :class="['bi', target.kind === 'mobile' ? 'bi-phone' : 'bi-display']"
                                            aria-hidden="true"
                                        ></i>
                                        <span>
                                            <strong>{{ browserTargetLabel(target) }}</strong>
                                            <small>{{ previewTargetStatus(target) }}</small>
                                        </span>
                                    </button>
                                    <small
                                        v-if="compatiblePreviewTargets.length === 0"
                                        class="device-menu-hint"
                                    >
                                        {{ t('preview.browserTargetsUnavailable') }}
                                    </small>
                                </div>
                                <small v-else class="device-menu-hint">
                                    {{ t('preview.enableTestbenchHint') }}
                                </small>
                            </div>
                        </div>
                        <button
                            v-if="executionRunning"
                            class="icon-button execution-stop"
                            type="button"
                            data-testid="stop-preview-execution"
                            :aria-label="t('playback.stop')"
                            :title="t('playback.stop')"
                            @click="stopPlayback"
                        >
                            <span class="bi bi-stop-fill" aria-hidden="true"></span>
                        </button>
                        <button
                            class="icon-button preview-expand"
                            type="button"
                            data-testid="maximize-preview"
                            :aria-label="t(maximizedPanel === 'preview' ? 'workspace.restoreLayout' : 'workspace.maximizePreview')"
                            :title="t(maximizedPanel === 'preview' ? 'workspace.restoreLayout' : 'workspace.maximizePreview')"
                            @click="togglePanelMaximized('preview')"
                        >
                            <span
                                :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'preview' }]"
                                aria-hidden="true"
                                ><span></span><span></span><span></span><span></span
                            ></span>
                        </button>
                    </div>
                </header>

                <div ref="previewStage" class="preview-stage">
                    <div v-if="selectedBrowserTarget" class="remote-preview-placeholder">
                        <i class="bi bi-cast" aria-hidden="true"></i>
                        <strong>
                            {{ t('preview.remoteActiveOn', { target:
                            browserTargetLabel(selectedBrowserTarget) }) }}
                        </strong>
                        <small v-if="remotePreviewError" class="remote-preview-placeholder__error">
                            {{ remotePreviewError }}
                        </small>
                        <button
                            class="button button--quiet remote-preview-stop"
                            type="button"
                            data-testid="stop-remote-preview"
                            :disabled="browserTargetOpening"
                            @click="stopRemotePreview"
                        >
                            <i class="bi bi-stop-fill" aria-hidden="true"></i>
                            {{ t('preview.stopRemote') }}
                        </button>
                    </div>
                    <div v-else class="preview-canvas" :style="viewportStyle">
                        <div class="preview-viewport">
                            <iframe
                                v-if="previewDocument"
                                ref="previewFrame"
                                :key="previewRevision"
                                :srcdoc="previewDocument"
                                :title="t('preview.frameTitle')"
                                allow="camera; microphone"
                                sandbox="allow-scripts allow-same-origin"
                            ></iframe>
                        </div>
                    </div>
                </div>
            </section>

            <div
                class="workspace-splitter workspace-splitter--outer"
                role="separator"
                tabindex="0"
                data-testid="outer-splitter"
                :aria-label="t('workspace.resizePreview')"
                :aria-orientation="previewOrientation === 'portrait' ? 'vertical' : 'horizontal'"
                @pointerdown="startResize('outer', $event)"
                @keydown="resizeFromKeyboard('outer', $event)"
            >
                <span></span>
            </div>

            <section class="panel graph-panel" :aria-label="t('graph.title')">
                <header class="panel__header">
                    <div class="panel-header-actions">
                        <div
                            ref="nodeFlyout"
                            class="action-flyout"
                            @keydown.esc.stop.prevent="nodeMenuOpen = false"
                        >
                            <button
                                class="icon-button"
                                type="button"
                                data-testid="node-actions-trigger"
                                :disabled="executionRunning"
                                :aria-label="t('node.actions')"
                                :title="t('node.actions')"
                                aria-haspopup="menu"
                                :aria-expanded="String(nodeMenuOpen)"
                                @click="toggleNodeMenu"
                            >
                                <span class="bi bi-plus-lg" aria-hidden="true"></span>
                            </button>
                            <div
                                v-if="nodeMenuOpen"
                                class="flyout-menu action-flyout__menu"
                                role="menu"
                            >
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-input-node"
                                    @click="addNode('input')"
                                >
                                    <span
                                        class="bi bi-file-earmark-arrow-up"
                                        aria-hidden="true"
                                    ></span>
                                    <span>{{ t('node.addInput') }}</span>
                                </button>
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-camera-capability-node"
                                    @click="addNode('camera-capability')"
                                >
                                    <span class="bi bi-camera-video" aria-hidden="true"></span>
                                    <span>{{ t('node.addCameraCapability') }}</span>
                                </button>
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-layer-node"
                                    @click="addNode('layer')"
                                >
                                    <span class="bi bi-layers" aria-hidden="true"></span>
                                    <span>{{ t('node.addLayer') }}</span>
                                </button>
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-javascript-node"
                                    @click="addNode('javascript')"
                                >
                                    <span class="bi bi-braces" aria-hidden="true"></span>
                                    <span>{{ t('node.addJavaScript') }}</span>
                                </button>
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-browser-action-node"
                                    @click="addNode('browser-action')"
                                >
                                    <span class="bi bi-cursor" aria-hidden="true"></span>
                                    <span>{{ t('node.addBrowserAction') }}</span>
                                </button>
                                <button
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="add-browser-wait-node"
                                    @click="addNode('browser-wait')"
                                >
                                    <span class="bi bi-hourglass-split" aria-hidden="true"></span>
                                    <span>{{ t('node.addBrowserWait') }}</span>
                                </button>
                                <button
                                    v-if="activeNode && !activeWebsite && !activeInput && !activeCapability"
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="play-node-current"
                                    @click="playActiveNodeOnCurrentState"
                                >
                                    <span class="bi bi-lightning-fill" aria-hidden="true"></span>
                                    <span>{{ t('playback.currentNode') }}</span>
                                </button>
                                <button
                                    v-if="activeNode && !activeWebsite"
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="duplicate-node"
                                    @click="duplicateActiveNode"
                                >
                                    <span class="bi bi-copy" aria-hidden="true"></span>
                                    <span>{{ t('node.duplicate') }}</span>
                                </button>
                                <button
                                    v-if="activeNode && !activeWebsite"
                                    class="action-option"
                                    type="button"
                                    role="menuitem"
                                    data-testid="delete-node"
                                    @click="deleteActiveNode"
                                >
                                    <span class="bi bi-trash3" aria-hidden="true"></span>
                                    <span>{{ t('node.delete') }}</span>
                                </button>
                            </div>
                        </div>
                        <button
                            v-if="activeConnectionId"
                            class="icon-button"
                            type="button"
                            data-testid="delete-connection"
                            :disabled="executionRunning"
                            :aria-label="t('graph.deleteConnection')"
                            :title="t('graph.deleteConnection')"
                            @click="deleteConnection()"
                        >
                            <span class="bi bi-trash3" aria-hidden="true"></span>
                        </button>
                        <button
                            class="icon-button"
                            type="button"
                            data-testid="auto-layout-graph"
                            :disabled="executionRunning || graphLayoutRunning"
                            :aria-label="t('graph.autoLayout')"
                            :title="t('graph.autoLayout')"
                            @click="autoLayoutGraph"
                        >
                            <span class="bi bi-diagram-3" aria-hidden="true"></span>
                        </button>
                        <div class="zoom-control" :aria-label="t('zoom.graph')">
                            <button
                                type="button"
                                data-testid="graph-zoom-out"
                                :aria-label="t('zoom.out')"
                                @click="changeGraphZoom(-0.25)"
                            >
                                −
                            </button>
                            <button
                                type="button"
                                data-testid="graph-zoom-reset"
                                :aria-label="t('zoom.reset')"
                                @click="resetGraphZoom"
                            >
                                {{ graphZoomPercent }} %
                            </button>
                            <button
                                type="button"
                                data-testid="graph-zoom-in"
                                :aria-label="t('zoom.in')"
                                @click="changeGraphZoom(0.25)"
                            >
                                +
                            </button>
                        </div>
                        <button
                            v-if="!recordingActive"
                            :class="[
                                'icon-button',
                                executionRunning ? 'execution-stop' : 'workflow-play',
                            ]"
                            type="button"
                            :data-testid="executionRunning ? 'stop-workflow' : 'play-workflow'"
                            :disabled="browserTargetOpening && !executionRunning"
                            :aria-label="t(executionRunning ? 'playback.stop' : 'playback.workflow')"
                            :title="t(executionRunning ? 'playback.stop' : 'playback.workflow')"
                            @click="executionRunning ? stopPlayback() : playWorkflow()"
                        >
                            <span
                                :class="['bi', executionRunning ? 'bi-stop-fill' : 'bi-play-fill']"
                                aria-hidden="true"
                            ></span>
                        </button>
                        <div
                            ref="recordingFlyout"
                            class="action-flyout recording-flyout"
                            @keydown.esc.stop.prevent="recordingMenuOpen = false"
                        >
                            <button
                                :class="[
                                    'icon-button',
                                    'recording-control',
                                    { 'is-recording': recordingActive },
                                ]"
                                type="button"
                                :data-testid="recordingActive ? 'stop-recording' : 'record-workflow'"
                                :disabled="!recordingActive && (executionRunning || browserTargetOpening || recordingWorkflow || !browserTestbenchRunning || !recordingTargetsAvailable || !browserSessionInputsReady)"
                                :aria-label="t(recordingActive ? 'recording.stop' : 'recording.chooseTarget')"
                                :title="t(recordingActive ? 'recording.stop' : 'recording.chooseTarget')"
                                aria-haspopup="menu"
                                :aria-expanded="String(!recordingActive && recordingMenuOpen)"
                                @click="recordingActive ? stopRecordingWorkflow() : toggleRecordingMenu()"
                            >
                                <span
                                    :class="['bi', recordingActive ? 'bi-stop-fill' : 'bi-circle-fill']"
                                    aria-hidden="true"
                                ></span>
                            </button>
                            <div
                                v-if="recordingMenuOpen && !recordingActive"
                                class="flyout-menu target-flyout__menu recording-flyout__menu"
                                role="menu"
                                :aria-label="t('recording.target')"
                            >
                                <button
                                    v-for="target in availableRecordingTargets"
                                    :key="target.id"
                                    class="target-option recording-target-option"
                                    type="button"
                                    role="menuitem"
                                    :data-testid="`recording-target-${target.id}`"
                                    @click="startRecordingOnTarget(target)"
                                >
                                    <i
                                        :class="['bi', target.kind === 'mobile' ? 'bi-phone' : 'bi-display']"
                                        aria-hidden="true"
                                    ></i>
                                    <span>
                                        <strong>{{ browserTargetLabel(target) }}</strong>
                                        <small>{{ recordingTargetStatus(target) }}</small>
                                    </span>
                                </button>
                            </div>
                        </div>
                        <button
                            class="icon-button"
                            type="button"
                            data-testid="maximize-graph"
                            :aria-label="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                            :title="t(maximizedPanel === 'graph' ? 'workspace.restoreLayout' : 'workspace.maximizeGraph')"
                            @click="togglePanelMaximized('graph')"
                        >
                            <span
                                :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'graph' }]"
                                aria-hidden="true"
                                ><span></span><span></span><span></span><span></span
                            ></span>
                        </button>
                    </div>
                </header>
                <div
                    ref="graph"
                    class="graph-canvas"
                    data-testid="graph-canvas"
                    @pointerdown.capture="startStageGesture('graph', $event)"
                    @pointermove.capture="moveStageGesture('graph', $event)"
                    @pointerup.capture="endStageGesture('graph', $event)"
                    @pointercancel.capture="endStageGesture('graph', $event)"
                    @wheel="zoomFromWheel('graph', $event)"
                    @dblclick="resetGraphZoom"
                    @contextmenu.prevent
                ></div>
            </section>

            <div
                class="workspace-splitter workspace-splitter--inner"
                role="separator"
                tabindex="0"
                data-testid="inner-splitter"
                :aria-label="t('workspace.resizeTools')"
                :aria-orientation="previewOrientation === 'portrait' ? 'horizontal' : 'vertical'"
                @pointerdown="startResize('inner', $event)"
                @keydown="resizeFromKeyboard('inner', $event)"
            >
                <span></span>
            </div>

            <section class="panel editor-panel" :aria-label="editorPanelTitle">
                <header class="panel__header panel__header--editor">
                    <div v-if="activeNode" class="editor-node-header">
                        <label class="editor-node-name">
                            <span class="visually-hidden">{{ t('node.name') }}</span>
                            <input
                                v-model="activeNode.name"
                                type="text"
                                data-testid="node-name"
                                :aria-label="t('node.name')"
                                @input="markDirty(); renderGraph()"
                            />
                        </label>
                        <p v-if="activeNodeError" class="node-execution-error" role="alert">
                            <span class="bi bi-exclamation-triangle-fill" aria-hidden="true"></span>
                            <span>{{ activeNodeError }}</span>
                        </p>
                        <button
                            class="icon-button"
                            type="button"
                            data-testid="maximize-editor"
                            :aria-label="t(maximizedPanel === 'editor' ? 'workspace.restoreLayout' : 'workspace.maximizeEditor')"
                            :title="t(maximizedPanel === 'editor' ? 'workspace.restoreLayout' : 'workspace.maximizeEditor')"
                            @click="togglePanelMaximized('editor')"
                        >
                            <span
                                :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'editor' }]"
                                aria-hidden="true"
                                ><span></span><span></span><span></span><span></span
                            ></span>
                        </button>
                    </div>
                    <div
                        v-if="activeLayer"
                        class="layer-alignment-field"
                        role="group"
                        :aria-label="t('placement.alignment')"
                    >
                        <span>{{ t('placement.alignment') }}</span>
                        <div class="layer-alignment-controls">
                            <select
                                class="placement-reference-select"
                                data-testid="placement-reference"
                                :aria-label="t('placement.position')"
                                :value="placementReferenceType"
                                @change="setPlacementReference"
                            >
                                <option value="viewport">{{ t('placement.viewport') }}</option>
                                <option value="layer" :disabled="!availableParentLayers.length">
                                    {{ t('placement.layer') }}
                                </option>
                                <option value="dom">{{ t('placement.dom') }}</option>
                            </select>
                            <div class="alignment-controls">
                                <div
                                    class="alignment-button-group"
                                    role="group"
                                    :aria-label="t('placement.horizontal')"
                                >
                                    <button
                                        v-for="alignment in ['left', 'center', 'right']"
                                        :key="alignment"
                                        :class="['alignment-icon-button', { 'is-active': horizontalAlignment === alignment }]"
                                        type="button"
                                        :data-testid="`horizontal-${alignment}`"
                                        :aria-label="t(`placement.${alignment}`)"
                                        :title="t(`placement.${alignment}`)"
                                        :aria-pressed="String(horizontalAlignment === alignment)"
                                        @click="setHorizontalAlignment(alignment)"
                                    >
                                        <span
                                            :class="['alignment-icon', `alignment-icon--horizontal-${alignment}`]"
                                            aria-hidden="true"
                                            ><span></span><span></span><span></span
                                        ></span>
                                    </button>
                                </div>
                                <div
                                    class="alignment-button-group"
                                    role="group"
                                    :aria-label="t('placement.vertical')"
                                >
                                    <button
                                        v-for="alignment in ['top', 'center', 'bottom']"
                                        :key="alignment"
                                        :class="['alignment-icon-button', { 'is-active': verticalAlignment === alignment }]"
                                        type="button"
                                        :data-testid="`vertical-${alignment}`"
                                        :aria-label="t(`placement.${alignment}`)"
                                        :title="t(`placement.${alignment}`)"
                                        :aria-pressed="String(verticalAlignment === alignment)"
                                        @click="setVerticalAlignment(alignment)"
                                    >
                                        <span
                                            :class="['alignment-icon', `alignment-icon--vertical-${alignment}`]"
                                            aria-hidden="true"
                                            ><span></span><span></span><span></span
                                        ></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>

                <div
                    :class="[
                        'editor-panel__body',
                        {
                            'editor-panel__body--layer': activeLayer,
                            'editor-panel__body--javascript': activeJavaScript,
                        },
                    ]"
                    data-testid="editor-properties-scroll"
                    tabindex="0"
                >
                    <template v-if="activeLayer">
                        <div
                            v-if="activeLayer.placement.reference.type === 'layer'"
                            class="layer-placement-properties"
                        >
                            <label>
                                <span>{{ t('placement.parentLayer') }}</span>
                                <select
                                    :value="activeLayer.placement.reference.nodeId"
                                    data-testid="placement-parent-layer"
                                    @change="setParentLayer"
                                >
                                    <option
                                        v-for="layer in availableParentLayers"
                                        :key="layer.id"
                                        :value="layer.id"
                                    >
                                        {{ layer.name }}
                                    </option>
                                </select>
                            </label>
                        </div>
                        <div
                            v-if="activeLayer.placement.reference.type === 'dom'"
                            class="layer-placement-properties"
                        >
                            <label>
                                <span>{{ t('placement.domSelector') }}</span>
                                <span class="selector-field">
                                    <input
                                        v-model="activeLayer.placement.reference.selector"
                                        type="text"
                                        data-testid="placement-dom-selector"
                                        spellcheck="false"
                                        @input="markActiveNodeStale"
                                    />
                                    <button
                                        type="button"
                                        :class="['icon-button', { 'is-active': selectorPicking }]"
                                        :disabled="
                                            !selectorPicking &&
                                            (!selectedBrowserTarget ||
                                                executionRunning ||
                                                !browserSessionInputsReady)
                                        "
                                        data-testid="pick-placement-dom-selector"
                                        :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                        @click="toggleSelectorPicker"
                                    >
                                        <i
                                            :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                            aria-hidden="true"
                                        ></i>
                                    </button>
                                </span>
                            </label>
                        </div>
                        <div class="layer-playback-properties">
                            <label>
                                <span>{{ t('layer.duration') }}</span>
                                <input
                                    v-model.number="activeLayer.playback.durationMs"
                                    type="number"
                                    min="0"
                                    step="100"
                                    data-testid="layer-duration"
                                    @input="markActiveNodeStale"
                                />
                            </label>
                            <label class="layer-playback-properties__toggle">
                                <input
                                    v-model="activeLayer.playback.removeAfter"
                                    type="checkbox"
                                    data-testid="layer-remove-after"
                                    @change="markActiveNodeStale"
                                />
                                <span>{{ t('layer.removeAfter') }}</span>
                            </label>
                        </div>
                        <div class="source-tabs" role="tablist" :aria-label="t('editor.title')">
                            <button
                                v-for="source in sourceTypes"
                                :id="`source-tab-${source}`"
                                :key="source"
                                :class="['source-tab', `source-tab--${source}`, { 'is-active': activeSource === source }]"
                                type="button"
                                role="tab"
                                :aria-selected="String(activeSource === source)"
                                :aria-controls="`source-panel-${source}`"
                                @click="activeSource = source"
                            >
                                <span class="source-tab__dot" aria-hidden="true"></span>
                                {{ t(`editor.${source}`) }}
                            </button>
                        </div>

                        <div
                            :id="`source-panel-${activeSource}`"
                            class="source-editor"
                            role="tabpanel"
                            :aria-labelledby="`source-tab-${activeSource}`"
                        >
                            <span
                                ref="sourceGutter"
                                class="source-editor__gutter"
                                aria-hidden="true"
                                >{{ lineNumbers }}</span
                            >
                            <textarea
                                :value="activeLayer.source[activeSource]"
                                :aria-label="t(`editor.${activeSource}Label`)"
                                autocapitalize="off"
                                autocomplete="off"
                                spellcheck="false"
                                wrap="off"
                                @input="updateSource"
                                @keydown="handleEditorKeydown"
                                @scroll="syncSourceGutter"
                            ></textarea>
                        </div>
                    </template>
                    <div v-else-if="activeJavaScript" class="source-editor">
                        <span ref="sourceGutter" class="source-editor__gutter" aria-hidden="true"
                            >{{ lineNumbers }}</span
                        >
                        <textarea
                            :value="activeJavaScript.source"
                            :aria-label="t('editor.javascriptLabel')"
                            autocapitalize="off"
                            autocomplete="off"
                            spellcheck="false"
                            wrap="off"
                            @input="updateJavaScriptSource"
                            @keydown="handleEditorKeydown"
                            @scroll="syncSourceGutter"
                        ></textarea>
                    </div>
                    <div v-else-if="activeBrowserAction" class="automation-properties">
                        <label>
                            <span>{{ t('browserAction.action') }}</span>
                            <select
                                v-model="activeBrowserAction.action"
                                @change="markActiveNodeStale"
                            >
                                <option value="click">{{ t('browserAction.click') }}</option>
                            </select>
                        </label>
                        <label>
                            <span>{{ t('browser.selector') }}</span>
                            <span class="selector-field">
                                <input
                                    v-model="activeBrowserAction.selector"
                                    type="text"
                                    data-testid="browser-action-selector"
                                    spellcheck="false"
                                    @input="markActiveNodeStale"
                                />
                                <button
                                    type="button"
                                    :class="['icon-button', { 'is-active': selectorPicking }]"
                                    :disabled="
                                        !selectorPicking &&
                                        (!selectedBrowserTarget ||
                                            browserTargetOpening ||
                                            executionRunning ||
                                            !browserSessionInputsReady)
                                    "
                                    data-testid="pick-browser-action-selector"
                                    :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                    @click="toggleSelectorPicker"
                                >
                                    <i
                                        :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                        aria-hidden="true"
                                    ></i>
                                </button>
                            </span>
                        </label>
                    </div>
                    <div v-else-if="activeBrowserWait" class="automation-properties">
                        <label>
                            <span>{{ t('browserWait.condition') }}</span>
                            <select
                                v-model="activeBrowserWait.condition"
                                data-testid="browser-wait-condition"
                                @change="markActiveNodeStale"
                            >
                                <option value="element">{{ t('browserWait.element') }}</option>
                                <option value="url">{{ t('browserWait.url') }}</option>
                                <option value="script">{{ t('browserWait.script') }}</option>
                            </select>
                        </label>
                        <label v-if="activeBrowserWait.condition === 'element'">
                            <span>{{ t('browser.selector') }}</span>
                            <span class="selector-field">
                                <input
                                    v-model="activeBrowserWait.selector"
                                    type="text"
                                    data-testid="browser-wait-selector"
                                    spellcheck="false"
                                    @input="markActiveNodeStale"
                                />
                                <button
                                    type="button"
                                    :class="['icon-button', { 'is-active': selectorPicking }]"
                                    :disabled="
                                        !selectorPicking &&
                                        (!selectedBrowserTarget ||
                                            executionRunning ||
                                            !browserSessionInputsReady)
                                    "
                                    data-testid="pick-browser-wait-selector"
                                    :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                    @click="toggleSelectorPicker"
                                >
                                    <i
                                        :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                        aria-hidden="true"
                                    ></i>
                                </button>
                            </span>
                        </label>
                        <label v-else-if="activeBrowserWait.condition === 'url'">
                            <span>{{ t('browserWait.urlValue') }}</span>
                            <input
                                v-model="activeBrowserWait.value"
                                type="text"
                                data-testid="browser-wait-url"
                                spellcheck="false"
                                @input="markActiveNodeStale"
                            />
                        </label>
                        <label v-else>
                            <span>{{ t('browserWait.scriptSource') }}</span>
                            <textarea
                                v-model="activeBrowserWait.script"
                                data-testid="browser-wait-script"
                                spellcheck="false"
                                @input="markActiveNodeStale"
                            ></textarea>
                        </label>
                        <label>
                            <span>{{ t('browser.timeout') }}</span>
                            <input
                                v-model.number="activeBrowserWait.timeoutMs"
                                type="number"
                                min="1"
                                step="1000"
                                data-testid="browser-wait-timeout"
                                @input="markActiveNodeStale"
                            />
                        </label>
                        <label class="automation-properties__toggle">
                            <input
                                v-model="activeBrowserWait.omitFromRecording"
                                type="checkbox"
                                data-testid="browser-wait-omit-from-recording"
                                @change="markActiveNodeStale"
                            />
                            <span>{{ t('browserWait.omitFromRecording') }}</span>
                        </label>
                    </div>
                    <div v-else-if="activeWebsite" class="website-properties">
                        <label for="website-url">{{ t('website.url') }}</label>
                        <input
                            id="website-url"
                            :value="activeWebsite.url"
                            type="url"
                            inputmode="url"
                            autocomplete="url"
                            data-testid="website-url"
                            :placeholder="t('website.urlPlaceholder')"
                            @input="updateWebsiteUrl"
                        />
                        <p>{{ t('website.frameHint') }}</p>
                    </div>
                    <div v-else-if="activeInput" class="project-inputs">
                        <div class="project-input">
                            <label>
                                <span>{{ t('project.inputId') }}</span>
                                <input
                                    :value="activeInput.id"
                                    type="text"
                                    spellcheck="false"
                                    readonly
                                />
                            </label>
                            <label>
                                <span>{{ t('project.inputAccept') }}</span>
                                <span class="tag-combobox">
                                    <span
                                        v-for="value in inputAcceptValues(activeInput)"
                                        :key="value"
                                        class="tag-pill"
                                    >
                                        {{ value }}
                                        <button
                                            type="button"
                                            :aria-label="t('project.removeInputAccept', { value })"
                                            @click="removeInputAccept(activeInput, value)"
                                        >
                                            <i class="bi bi-x" aria-hidden="true"></i>
                                        </button>
                                    </span>
                                    <input
                                        v-model="inputAcceptQueries[activeInput.id]"
                                        type="text"
                                        role="combobox"
                                        autocomplete="off"
                                        spellcheck="false"
                                        :data-testid="`project-input-${activeInput.id}-accept`"
                                        :aria-expanded="String(activeInputAcceptId === activeInput.id)"
                                        :aria-controls="`project-input-${activeInput.id}-accept-options`"
                                        :placeholder="t('project.inputAcceptPlaceholder')"
                                        @focus="focusInputAccept(activeInput.id)"
                                        @input="focusInputAccept(activeInput.id)"
                                        @blur="blurInputAccept(activeInput.id)"
                                        @keydown="handleInputAcceptKeydown(activeInput, $event)"
                                    />
                                    <span
                                        v-if="
                                                activeInputAcceptId === activeInput.id &&
                                                inputAcceptSuggestions(activeInput).length
                                            "
                                        :id="`project-input-${activeInput.id}-accept-options`"
                                        class="tag-suggestions"
                                        role="listbox"
                                    >
                                        <button
                                            v-for="suggestion in inputAcceptSuggestions(activeInput)"
                                            :key="suggestion"
                                            type="button"
                                            role="option"
                                            @mousedown.prevent
                                            @click="addInputAccept(activeInput, suggestion)"
                                        >
                                            {{ suggestion }}
                                        </button>
                                    </span>
                                </span>
                            </label>
                            <label class="project-input__required">
                                <input
                                    v-model="activeInput.required"
                                    type="checkbox"
                                    :data-testid="`project-input-${activeInput.id}-required`"
                                    @change="markExecutionDirty"
                                />
                                <span>{{ t('project.inputRequiredToggle') }}</span>
                            </label>
                            <label>
                                <span>{{ t('project.inputValue') }}</span>
                                <input
                                    :data-testid="`project-input-${activeInput.id}`"
                                    type="file"
                                    :accept="activeInput.accept"
                                    @change="updateInputFile(activeInput.id, $event)"
                                />
                            </label>
                            <div class="project-preparations">
                                <span>{{ t('project.prepareModules') }}</span>
                                <div
                                    v-for="(module, index) in activeInput.prepare?.modules ?? []"
                                    :key="`${activeInput.id}-${index}`"
                                    class="project-preparation"
                                >
                                    <input
                                        :value="module"
                                        type="text"
                                        spellcheck="false"
                                        :data-testid="`project-input-${activeInput.id}-prepare-module-${index}`"
                                        :aria-label="t('project.prepareModule')"
                                        :placeholder="t('project.prepareModulePlaceholder')"
                                        @input="updateInputPreparation(activeInput.id, index, $event)"
                                    />
                                    <button
                                        class="icon-button icon-button--small"
                                        type="button"
                                        :data-testid="`project-input-${activeInput.id}-remove-prepare-module-${index}`"
                                        :aria-label="t('project.removePrepareModule')"
                                        @click="removeInputPreparation(activeInput.id, index)"
                                    >
                                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                                    </button>
                                </div>
                                <button
                                    class="text-action"
                                    type="button"
                                    :data-testid="`project-input-${activeInput.id}-add-prepare-module`"
                                    @click="addInputPreparation(activeInput.id)"
                                >
                                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                                    {{ t('project.addPrepareModule') }}
                                </button>
                            </div>
                        </div>
                    </div>
                    <div v-else-if="activeCapability" class="capability-properties">
                        <p>{{ t('capability.cameraHint') }}</p>
                    </div>
                </div>
            </section>
        </main>

        <div
            v-if="mcpSetupOpen"
            class="modal-backdrop"
            data-testid="mcp-setup-backdrop"
            @pointerdown.self="closeMcpSetup"
        >
            <section
                class="setup-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="mcp-title"
            >
                <header>
                    <div>
                        <h2 id="mcp-title">{{ t('mcp.title') }}</h2>
                        <p>{{ t('mcp.intro') }}</p>
                    </div>
                    <button
                        class="icon-button"
                        type="button"
                        data-testid="close-mcp-setup"
                        :aria-label="t('mcp.close')"
                        @click="closeMcpSetup"
                    >
                        <i class="bi bi-x-lg" aria-hidden="true"></i>
                    </button>
                </header>
                <div v-if="mcpLoading" class="setup-dialog__state" role="status">
                    <i class="bi bi-arrow-repeat icon-spinner" aria-hidden="true"></i>
                    <span>{{ t('mcp.loading') }}</span>
                </div>
                <div
                    v-else-if="mcpLoadError"
                    class="setup-dialog__state setup-dialog__state--error"
                    data-testid="mcp-setup-error"
                    role="alert"
                >
                    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                    <span>{{ mcpLoadError }}</span>
                    <button class="button button--quiet" type="button" @click="loadMcpClients">
                        {{ t('mcp.retry') }}
                    </button>
                </div>
                <div v-else-if="!mcpClients.length" class="setup-dialog__state" role="status">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span>{{ t('mcp.empty') }}</span>
                </div>
                <div v-else class="mcp-client-list">
                    <article v-for="client in mcpClients" :key="client.id" class="mcp-client">
                        <div>
                            <strong>{{ client.label }}</strong>
                            <small>
                                {{ t( client.registered ? 'mcp.current' : client.installed ?
                                'mcp.available' : 'mcp.notInstalled', ) }}
                            </small>
                        </div>
                        <button
                            v-if="client.automatic"
                            class="button button--quiet"
                            type="button"
                            :disabled="!client.installed || mcpLoading || client.registered"
                            :data-testid="`connect-mcp-${client.id}`"
                            @click="connectMcpClient(client)"
                        >
                            {{ t(client.registered ? 'mcp.connectedAction' : 'mcp.connect') }}
                        </button>
                        <button
                            v-else
                            class="button button--quiet"
                            type="button"
                            @click="copyMcpConfiguration(client)"
                        >
                            {{ t('mcp.copy') }}
                        </button>
                        <code>{{ client.command }}</code>
                    </article>
                </div>
            </section>
        </div>

        <p v-if="notice" class="notice" role="status">{{ notice }}</p>
    </div>
</template>
