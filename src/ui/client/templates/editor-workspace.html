<template>
    <div class="director-shell">
        <director-topbar :workspace="$root"></director-topbar>

        <main
            ref="workspace"
            :class="[
                'workspace',
                `workspace--${previewOrientation}`,
                {
                    'workspace--panel-maximized': maximizedPanel,
                    [`workspace--maximized-${maximizedPanel}`]: maximizedPanel,
                    [`workspace--mobile-${mobileActivePanel}`]: true,
                },
            ]"
            :style="workspaceStyle"
        >
            <nav
                class="mobile-workspace-tabs"
                role="tablist"
                :aria-label="t('workspace.mobileViews')"
            >
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-graph-tab"
                    :class="{ 'is-active': mobileActivePanel === 'graph' }"
                    :aria-selected="String(mobileActivePanel === 'graph')"
                    @click="setMobilePanel('graph')"
                >
                    {{ t('graph.title') }}
                </button>
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-editor-tab"
                    :class="{ 'is-active': mobileActivePanel === 'editor' }"
                    :aria-selected="String(mobileActivePanel === 'editor')"
                    @click="setMobilePanel('editor')"
                >
                    {{ editorPanelTitle }}
                </button>
                <button
                    type="button"
                    role="tab"
                    data-testid="mobile-preview-tab"
                    :class="{ 'is-active': mobileActivePanel === 'preview' }"
                    :aria-selected="String(mobileActivePanel === 'preview')"
                    @click="setMobilePanel('preview')"
                >
                    {{ t('preview.title') }}
                </button>
            </nav>

            <preview-panel :workspace="$root"></preview-panel>

            <div
                class="workspace-splitter workspace-splitter--outer"
                role="separator"
                tabindex="0"
                data-testid="outer-splitter"
                :aria-label="t('workspace.resizePreview')"
                :aria-orientation="previewOrientation === 'portrait' ? 'vertical' : 'horizontal'"
                @pointerdown="startResize('outer', $event)"
                @keydown="resizeFromKeyboard('outer', $event)"
            >
                <span></span>
            </div>

            <graph-panel :workspace="$root"></graph-panel>

            <div
                class="workspace-splitter workspace-splitter--inner"
                role="separator"
                tabindex="0"
                data-testid="inner-splitter"
                :aria-label="t('workspace.resizeTools')"
                :aria-orientation="previewOrientation === 'portrait' ? 'horizontal' : 'vertical'"
                @pointerdown="startResize('inner', $event)"
                @keydown="resizeFromKeyboard('inner', $event)"
            >
                <span></span>
            </div>

            <node-editor-panel :workspace="$root"></node-editor-panel>
        </main>

        <mcp-setup-dialog :workspace="$root"></mcp-setup-dialog>
        <project-settings-dialog :workspace="$root"></project-settings-dialog>
        <workflow-output-dialog :workspace="$root"></workflow-output-dialog>
        <confirm-dialog
            :open="Boolean(pendingSourceConversion)"
            :title="
                t(pendingSourceConversion?.kind === 'delay' ? 'delay.convert' : 'textLayer.convert')
            "
            :message="
                t(
                    pendingSourceConversion?.kind === 'delay'
                        ? 'delay.convertConfirm'
                        : 'textLayer.convertConfirm',
                )
            "
            :confirm-label="t('dialog.convert')"
            :cancel-label="t('dialog.cancel')"
            :close-label="t('dialog.close')"
            :show-close-button="true"
            :close-on-backdrop="true"
            @confirm="confirmSourceConversion"
            @cancel="cancelSourceConversion"
        ></confirm-dialog>
        <p v-if="notice" class="notice" role="status">{{ notice }}</p>
    </div>
</template>
