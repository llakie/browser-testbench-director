                            :data-testid="`project-input-${activeInput.id}-add-prepare-module`"
                            @click="addInputPreparation(activeInput.id)"
                        >
                            <i class="bi bi-plus-lg" aria-hidden="true"></i>
                            {{ t('project.addPrepareModule') }}
                        </button>
                    </div>
                </div>
            </div>
            <div v-else-if="activeCapability" class="capability-properties">
                <p>{{ t('capability.cameraHint') }}</p>
            </div>
            <div v-else-if="activeMerge" class="automation-properties">
                <label>
                    <span>{{ t('merge.waitFor') }}</span>
                    <select
                        v-model="activeMerge.waitFor"
                        data-testid="merge-wait-for"
                        @change="markActiveNodeStale"
                    >
                        <option value="all">{{ t('merge.all') }}</option>
                        <option value="any">{{ t('merge.any') }}</option>
                    </select>
                </label>
            </div>
            <div v-else-if="activeAudio" class="automation-properties">
                <label>
                    <span>{{ t('audio.volume') }}</span>
                    <span class="audio-volume-field">
                        <input
                            v-model.number="activeAudio.volume"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            data-testid="audio-volume"
                            @input="markActiveNodeStale"
                        />
                        <output>{{ Math.round(activeAudio.volume * 100) }} %</output>
                    </span>
                </label>
                <label class="audio-envelope-field">
                    <span>{{ t('audio.envelope') }}</span>
                    <audio-envelope-editor
                        v-model="activeAudio.envelope"
                        :label="t('audio.envelope')"
                        :delete-label="t('audio.deleteEnvelopePoint')"
                        @change="markActiveNodeStale"
                    ></audio-envelope-editor>
                </label>
                <label class="automation-properties__toggle">
                    <input
                        v-model="activeAudio.waitForEnd"
                        type="checkbox"
                        data-testid="audio-wait-for-end"
                        @change="markActiveNodeStale"
                    />
                    <span>{{ t('audio.waitForEnd') }}</span>
                </label>
                <p
                    class="property-hint"
                    :class="{ 'audio-file-name': activeAudioFileName }"
                    :title="activeAudioFileName"
                    data-testid="audio-file-name"
                >
                    {{ activeAudioFileName || t('audio.inputHint') }}
                </p>
            </div>
            <div v-else-if="activeVideoOutput" class="automation-properties">
                <label>
                    <span>{{ t('videoOutput.target') }}</span>
                    <select
                        v-model="activeVideoOutput.targetId"
                        data-testid="video-output-target"
                        @change="markDirty(); renderGraph()"
                    >
                        <option value="">{{ t('videoOutput.selectTarget') }}</option>
                        <option
                            v-for="target in availableRecordingTargets"
                            :key="target.id"
                            :value="target.id"
                        >
                            {{ browserTargetLabel(target) }} · {{ recordingTargetStatus(target) }}
                        </option>
                    </select>
                </label>
                <label>
                    <span>{{ t('videoOutput.filename') }}</span>
                    <input
                        v-model.trim="activeVideoOutput.filename"
                        type="text"
                        data-testid="video-output-filename"
                        placeholder="video.mp4"
                        @input="markDirty"
                        @change="renderGraph"
                    />
                </label>
            </div>
        </div>
    </section>
