<template>
    <section
        :class="['panel', 'editor-panel', { 'editor-panel--audio': activeAudio }]"
        :aria-label="editorPanelTitle"
    >
        <node-editor-header :workspace="workspace"></node-editor-header>

        <div v-if="activeAudio" class="audio-playhead" data-testid="audio-playhead">
            <range-control
                :model-value="audioPositionMs"
                :min="0"
                :max="Math.max(1, audioPlayableDurationMs)"
                :step="10"
                :disabled="!audioSeekEnabled || audioPlayableDurationMs <= 0"
                :aria-label="t('audio.position')"
                :value-text="`${formatAudioTime(audioPositionMs)} / ${formatAudioTime(audioPlayableDurationMs)}`"
                value-width="time"
                tone="audio"
                test-id="audio-position"
                @pointerdown="audioScrubbing = true"
                @pointercancel="audioScrubbing = false"
                @update:model-value="audioPositionMs = $event"
                @change="seekActiveAudio(Number($event.target.value))"
            ></range-control>
        </div>

        <div
            :class="[
                        'editor-panel__body',
                        {
                            'editor-panel__body--layer': activeLayer,
                            'editor-panel__body--javascript': activeJavaScript,
                            'editor-panel__body--locked': editorPanelLocked && !activeAudio,
                            'editor-panel__body--wait-script':
                                activeBrowserWait?.condition === 'script',
                        },
                    ]"
            :aria-disabled="editorPanelLocked && !activeAudio"
            :inert="editorPanelLocked && !activeAudio"
            data-testid="editor-properties-scroll"
            tabindex="0"
        >
            <layer-node-properties
                v-if="activeLayer"
                :workspace="workspace"
            ></layer-node-properties>
            <template v-else-if="activeJavaScript">
                <property-accordion
                    v-if="activeDelay"
                    :title="t('delay.timing')"
                    open
                    test-id="delay-timing-group"
                >
                    <div class="automation-properties">
                        <property-field :label="t('delay.duration')">
                            <number-control
                                v-model="activeDelay.delay.durationMs"
                                :min="0"
                                :step="100"
                                suffix="ms"
                                test-id="delay-duration"
                                :disabled="editorPanelLocked"
                                @input="updateActiveDelay"
                            ></number-control>
                        </property-field>
                    </div>
                </property-accordion>
                <source-editor
                    v-else
                    :model-value="activeJavaScript.source"
                    :label="t('editor.javascriptLabel')"
                    :formatting="formattingSource"
                    @update:model-value="updateJavaScriptSource"
                    @format="formatActiveSource"
                ></source-editor>
            </template>
            <property-accordion
                v-else-if="activeBrowserAction"
                :title="t('browserAction.title')"
                :preview="activeBrowserAction.selector"
                open
            >
                <div class="automation-properties">
                    <property-field :label="t('browser.selector')">
                        <span class="selector-field">
                            <input
                                v-model="activeBrowserAction.selector"
                                type="text"
                                data-testid="browser-action-selector"
                                spellcheck="false"
                                @input="markActiveNodeStale"
                            />
                            <button
                                type="button"
                                :class="['icon-button', { 'is-active': selectorPicking }]"
                                :disabled="
                                        !selectorPicking &&
                                        (!selectedBrowserTarget ||
                                            browserTargetOpening ||
                                            executionRunning ||
                                            !browserSessionInputsReady)
                                    "
                                data-testid="pick-browser-action-selector"
                                :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                @click="toggleSelectorPicker"
                            >
                                <i
                                    :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                    aria-hidden="true"
                                ></i>
                            </button>
                        </span>
                    </property-field>
                </div>
            </property-accordion>
            <template v-else-if="activeBrowserWait">
                <property-accordion
                    :title="t('browserWait.condition')"
                    :preview="t(`browserWait.${activeBrowserWait.condition}`)"
                    group="browser-wait-properties"
                    open
                    test-id="browser-wait-condition-group"
                    summary-test-id="browser-wait-condition-summary"
                >
                    <div class="automation-properties">
                        <property-field :label="t('browserWait.condition')">
                            <select
                                :value="activeBrowserWait.condition"
                                data-testid="browser-wait-condition"
                                @change="setBrowserWaitCondition"
                            >
                                <option value="element">{{ t('browserWait.element') }}</option>
                                <option value="url">{{ t('browserWait.url') }}</option>
                                <option value="script">{{ t('browserWait.script') }}</option>
                            </select>
                        </property-field>
                        <property-field
                            v-if="activeBrowserWait.condition === 'element'"
                            :label="t('browser.selector')"
                        >
                            <span class="selector-field">
                                <input
                                    v-model="activeBrowserWait.selector"
                                    type="text"
                                    data-testid="browser-wait-selector"
                                    spellcheck="false"
                                    @input="markActiveNodeStale"
                                />
                                <button
                                    type="button"
                                    :class="['icon-button', { 'is-active': selectorPicking }]"
                                    :disabled="
                                            !selectorPicking &&
                                            (!selectedBrowserTarget ||
                                                executionRunning ||
                                                !browserSessionInputsReady)
                                        "
                                    data-testid="pick-browser-wait-selector"
                                    :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                    @click="toggleSelectorPicker"
                                >
                                    <i
                                        :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                        aria-hidden="true"
                                    ></i>
                                </button>
                            </span>
                        </property-field>
                        <property-field
                            v-else-if="activeBrowserWait.condition === 'url'"
                            :label="t('browserWait.urlValue')"
                        >
                            <input
                                v-model="activeBrowserWait.value"
                                type="text"
                                data-testid="browser-wait-url"
                                spellcheck="false"
                                @input="markActiveNodeStale"
                            />
                        </property-field>
                    </div>
                </property-accordion>
                <template v-if="activeBrowserWait.condition === 'script'">
                    <source-editor
                        :model-value="activeBrowserWait.script"
                        :label="t('browserWait.scriptSource')"
                        panel-id="source-panel-wait-javascript"
                        labelled-by="source-tab-wait-javascript"
                        test-id="browser-wait-script"
                        :formatting="formattingSource"
                        @update:model-value="updateBrowserWaitScript"
                        @format="formatActiveSource"
                    >
                        <template #tabs>
                            <div class="source-tabs" role="tablist" :aria-label="t('editor.title')">
                                <span
                                    id="source-tab-wait-javascript"
                                    class="source-tab source-tab--javascript is-active"
                                    role="tab"
                                    aria-selected="true"
                                    aria-controls="source-panel-wait-javascript"
                                >
                                    <span class="source-tab__dot" aria-hidden="true"></span>
                                    {{ t('editor.javascript') }}
                                </span>
                            </div>
                        </template>
                    </source-editor>
                </template>
                <property-accordion
                    :title="t('layer.timing')"
                    :preview="activeBrowserWait.timeoutMs + ' ms'"
                    group="browser-wait-properties"
                    test-id="browser-wait-timing-group"
                    summary-test-id="browser-wait-timing-summary"
                >
                    <div class="automation-properties">
                        <property-field :label="t('browser.timeout')">
                            <number-control
                                v-model="activeBrowserWait.timeoutMs"
                                :min="1"
                                :step="1000"
                                test-id="browser-wait-timeout"
                                @input="markActiveNodeStale"
                            ></number-control>
                        </property-field>
                        <toggle-control
                            v-model="activeBrowserWait.omitFromRecording"
                            :label="t('browserWait.omitFromRecording')"
                            test-id="browser-wait-omit-from-recording"
                            @change="markActiveNodeStale"
                        ></toggle-control>
                    </div>
                </property-accordion>
            </template>
            <property-accordion
                v-else-if="activeWebsite"
                :title="t('website.url')"
                :preview="activeWebsite.url"
                open
            >
                <div class="website-properties">
                    <property-field :label="t('website.url')">
                        <input
                            id="website-url"
                            :value="activeWebsite.url"
                            type="url"
                            inputmode="url"
                            autocomplete="url"
                            data-testid="website-url"
                            :placeholder="t('website.urlPlaceholder')"
                            @input="updateWebsiteUrl"
                        />
                    </property-field>
                    <p>{{ t('website.frameHint') }}</p>
                </div>
            </property-accordion>
            <input-node-properties
                v-else-if="activeInput"
                :workspace="workspace"
            ></input-node-properties>
            <property-accordion v-else-if="activeCapability" :title="t('capability.title')" open>
                <div class="capability-properties">
                    <p>{{ t('capability.cameraHint') }}</p>
                </div>
            </property-accordion>
            <property-accordion
                v-else-if="activeMerge"
                :title="t('merge.waitFor')"
                :preview="t(`merge.${activeMerge.waitFor}`)"
                open
            >
                <div class="automation-properties">
                    <property-field :label="t('merge.waitFor')">
                        <select
                            v-model="activeMerge.waitFor"
                            data-testid="merge-wait-for"
                            @change="markActiveNodeStale"
                        >
                            <option value="all">{{ t('merge.all') }}</option>
                            <option value="any">{{ t('merge.any') }}</option>
                        </select>
                    </property-field>
                </div>
            </property-accordion>
            <audio-node-properties
                v-else-if="activeAudio"
                :workspace="workspace"
            ></audio-node-properties>
            <property-accordion
                v-else-if="activeVideoOutput"
                :title="t('videoOutput.settings')"
                :preview="activeVideoOutput.filename"
                open
            >
                <div class="automation-properties">
                    <property-field :label="t('videoOutput.target')">
                        <select
                            v-model="activeVideoOutput.targetId"
                            data-testid="video-output-target"
                            @change="markDirty(); renderGraph()"
                        >
                            <option value="">{{ t('videoOutput.selectTarget') }}</option>
                            <option
                                v-for="target in availableRecordingTargets"
                                :key="target.id"
                                :value="target.id"
                            >
                                {{ browserTargetLabel(target) }} · {{ recordingTargetStatus(target)
                                }}
                            </option>
                        </select>
                    </property-field>
                    <property-field :label="t('videoOutput.filename')">
                        <input
                            v-model.trim="activeVideoOutput.filename"
                            type="text"
                            data-testid="video-output-filename"
                            placeholder="video.mp4"
                            @input="markDirty"
                            @change="renderGraph"
                        />
                    </property-field>
                </div>
            </property-accordion>
        </div>
    </section>
</template>
