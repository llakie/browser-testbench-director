<template>
    <section class="panel editor-panel" :aria-label="editorPanelTitle">
        <header class="panel__header panel__header--editor">
            <div v-if="activeNode" class="editor-node-header">
                <label class="editor-node-name">
                    <span class="visually-hidden">{{ t('node.name') }}</span>
                    <input
                        v-model="activeNode.name"
                        type="text"
                        data-testid="node-name"
                        :aria-label="t('node.name')"
                        @input="markDirty(); renderGraph()"
                    />
                </label>
                <p v-if="activeNodeError" class="node-execution-error" role="alert">
                    <span class="bi bi-exclamation-triangle-fill" aria-hidden="true"></span>
                    <span>{{ activeNodeError }}</span>
                </p>
                <button
                    class="icon-button"
                    type="button"
                    data-testid="maximize-editor"
                    :aria-label="t(maximizedPanel === 'editor' ? 'workspace.restoreLayout' : 'workspace.maximizeEditor')"
                    :title="t(maximizedPanel === 'editor' ? 'workspace.restoreLayout' : 'workspace.maximizeEditor')"
                    @click="togglePanelMaximized('editor')"
                >
                    <span
                        :class="['fullscreen-icon', { 'is-exit': maximizedPanel === 'editor' }]"
                        aria-hidden="true"
                        ><span></span><span></span><span></span><span></span
                    ></span>
                </button>
            </div>
        </header>

        <div
            :class="[
                        'editor-panel__body',
                        {
                            'editor-panel__body--layer': activeLayer,
                            'editor-panel__body--javascript': activeJavaScript,
                        },
                    ]"
            data-testid="editor-properties-scroll"
            tabindex="0"
        >
            <template v-if="activeLayer">
                <div
                    class="layer-alignment-field"
                    role="group"
                    :aria-label="t('placement.alignment')"
                >
                    <span>{{ t('placement.alignment') }}</span>
                    <div class="layer-alignment-controls">
                        <select
                            class="placement-reference-select"
                            data-testid="placement-reference"
                            :aria-label="t('placement.position')"
                            :value="placementReferenceType"
                            @change="setPlacementReference"
                        >
                            <option value="viewport">{{ t('placement.viewport') }}</option>
                            <option value="layer" :disabled="!availableParentLayers.length">
                                {{ t('placement.layer') }}
                            </option>
                            <option value="dom">{{ t('placement.dom') }}</option>
                        </select>
                        <div class="alignment-controls">
                            <div
                                class="alignment-button-group"
                                role="group"
                                :aria-label="t('placement.horizontal')"
                            >
                                <button
                                    v-for="alignment in ['left', 'center', 'right']"
                                    :key="alignment"
                                    :class="['alignment-icon-button', { 'is-active': horizontalAlignment === alignment }]"
                                    type="button"
                                    :data-testid="`horizontal-${alignment}`"
                                    :aria-label="t(`placement.${alignment}`)"
                                    :title="t(`placement.${alignment}`)"
                                    :aria-pressed="String(horizontalAlignment === alignment)"
                                    @click="setHorizontalAlignment(alignment)"
                                >
                                    <span
                                        :class="['alignment-icon', `alignment-icon--horizontal-${alignment}`]"
                                        aria-hidden="true"
                                        ><span></span><span></span><span></span
                                    ></span>
                                </button>
                            </div>
                            <div
                                class="alignment-button-group"
                                role="group"
                                :aria-label="t('placement.vertical')"
                            >
                                <button
                                    v-for="alignment in ['top', 'center', 'bottom']"
                                    :key="alignment"
                                    :class="['alignment-icon-button', { 'is-active': verticalAlignment === alignment }]"
                                    type="button"
                                    :data-testid="`vertical-${alignment}`"
                                    :aria-label="t(`placement.${alignment}`)"
                                    :title="t(`placement.${alignment}`)"
                                    :aria-pressed="String(verticalAlignment === alignment)"
                                    @click="setVerticalAlignment(alignment)"
                                >
                                    <span
                                        :class="['alignment-icon', `alignment-icon--vertical-${alignment}`]"
                                        aria-hidden="true"
                                        ><span></span><span></span><span></span
                                    ></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div
                    v-if="activeLayer.placement.reference.type === 'layer'"
                    class="layer-placement-properties"
                >
                    <label>
                        <span>{{ t('placement.parentLayer') }}</span>
                        <select
                            :value="activeLayer.placement.reference.nodeId"
                            data-testid="placement-parent-layer"
                            @change="setParentLayer"
                        >
                            <option
                                v-for="layer in availableParentLayers"
                                :key="layer.id"
                                :value="layer.id"
                            >
                                {{ layer.name }}
                            </option>
                        </select>
                    </label>
                </div>
                <div
                    v-if="activeLayer.placement.reference.type === 'dom'"
                    class="layer-placement-properties"
                >
                    <label>
                        <span>{{ t('placement.domSelector') }}</span>
                        <span class="selector-field">
                            <input
                                v-model="activeLayer.placement.reference.selector"
                                type="text"
                                data-testid="placement-dom-selector"
                                spellcheck="false"
                                @input="markActiveNodeStale"
                            />
                            <button
                                type="button"
                                :class="['icon-button', { 'is-active': selectorPicking }]"
                                :disabled="
                                            !selectorPicking &&
                                            (!selectedBrowserTarget ||
                                                executionRunning ||
                                                !browserSessionInputsReady)
                                        "
                                data-testid="pick-placement-dom-selector"
                                :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                                @click="toggleSelectorPicker"
                            >
                                <i
                                    :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                    aria-hidden="true"
                                ></i>
                            </button>
                        </span>
                    </label>
                </div>
                <div class="layer-playback-properties">
                    <label>
                        <span>{{ t('layer.duration') }}</span>
                        <input
                            v-model.number="activeLayer.playback.durationMs"
                            type="number"
                            min="0"
                            step="100"
                            data-testid="layer-duration"
                            @input="markActiveNodeStale"
                        />
                    </label>
                    <label class="layer-playback-properties__toggle">
                        <input
                            v-model="activeLayer.playback.removeAfter"
                            type="checkbox"
                            data-testid="layer-remove-after"
                            @change="markActiveNodeStale"
                        />
                        <span>{{ t('layer.removeAfter') }}</span>
                    </label>
                </div>
                <div class="source-tabs" role="tablist" :aria-label="t('editor.title')">
                    <button
                        v-for="source in sourceTypes"
                        :id="`source-tab-${source}`"
                        :key="source"
                        :class="['source-tab', `source-tab--${source}`, { 'is-active': activeSource === source }]"
                        type="button"
                        role="tab"
                        :aria-selected="String(activeSource === source)"
                        :aria-controls="`source-panel-${source}`"
                        @click="activeSource = source"
                    >
                        <span class="source-tab__dot" aria-hidden="true"></span>
                        {{ t(`editor.${source}`) }}
                    </button>
                </div>

                <div
                    :id="`source-panel-${activeSource}`"
                    class="source-editor"
                    role="tabpanel"
                    :aria-labelledby="`source-tab-${activeSource}`"
                >
                    <span
                        data-workspace-ref="sourceGutter"
                        class="source-editor__gutter"
                        aria-hidden="true"
                        >{{ lineNumbers }}</span
                    >
                    <textarea
                        :value="activeLayer.source[activeSource]"
                        :aria-label="t(`editor.${activeSource}Label`)"
                        autocapitalize="off"
                        autocomplete="off"
                        spellcheck="false"
                        wrap="off"
                        @input="updateSource"
                        @keydown="handleEditorKeydown"
                        @scroll="syncSourceGutter"
                    ></textarea>
                </div>
            </template>
            <div v-else-if="activeJavaScript" class="source-editor">
                <span
                    data-workspace-ref="sourceGutter"
                    class="source-editor__gutter"
                    aria-hidden="true"
                    >{{ lineNumbers }}</span
                >
                <textarea
                    :value="activeJavaScript.source"
                    :aria-label="t('editor.javascriptLabel')"
                    autocapitalize="off"
                    autocomplete="off"
                    spellcheck="false"
                    wrap="off"
                    @input="updateJavaScriptSource"
                    @keydown="handleEditorKeydown"
                    @scroll="syncSourceGutter"
                ></textarea>
            </div>
            <div v-else-if="activeBrowserAction" class="automation-properties">
                <label>
                    <span>{{ t('browserAction.action') }}</span>
                    <select v-model="activeBrowserAction.action" @change="markActiveNodeStale">
                        <option value="click">{{ t('browserAction.click') }}</option>
                    </select>
                </label>
                <label>
                    <span>{{ t('browser.selector') }}</span>
                    <span class="selector-field">
                        <input
                            v-model="activeBrowserAction.selector"
                            type="text"
                            data-testid="browser-action-selector"
                            spellcheck="false"
                            @input="markActiveNodeStale"
                        />
                        <button
                            type="button"
                            :class="['icon-button', { 'is-active': selectorPicking }]"
                            :disabled="
                                        !selectorPicking &&
                                        (!selectedBrowserTarget ||
                                            browserTargetOpening ||
                                            executionRunning ||
                                            !browserSessionInputsReady)
                                    "
                            data-testid="pick-browser-action-selector"
                            :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                            @click="toggleSelectorPicker"
                        >
                            <i
                                :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </span>
                </label>
            </div>
            <div v-else-if="activeBrowserWait" class="automation-properties">
                <label>
                    <span>{{ t('browserWait.condition') }}</span>
                    <select
                        v-model="activeBrowserWait.condition"
                        data-testid="browser-wait-condition"
                        @change="markActiveNodeStale"
                    >
                        <option value="element">{{ t('browserWait.element') }}</option>
                        <option value="url">{{ t('browserWait.url') }}</option>
                        <option value="script">{{ t('browserWait.script') }}</option>
                    </select>
                </label>
                <label v-if="activeBrowserWait.condition === 'element'">
                    <span>{{ t('browser.selector') }}</span>
                    <span class="selector-field">
                        <input
                            v-model="activeBrowserWait.selector"
                            type="text"
                            data-testid="browser-wait-selector"
                            spellcheck="false"
                            @input="markActiveNodeStale"
                        />
                        <button
                            type="button"
                            :class="['icon-button', { 'is-active': selectorPicking }]"
                            :disabled="
                                        !selectorPicking &&
                                        (!selectedBrowserTarget ||
                                            executionRunning ||
                                            !browserSessionInputsReady)
                                    "
                            data-testid="pick-browser-wait-selector"
                            :aria-label="t(selectorPicking ? 'browser.selectorPickerCancel' : 'browser.selectorPicker')"
                            @click="toggleSelectorPicker"
                        >
                            <i
                                :class="['bi', selectorPicking ? 'bi-x-lg' : 'bi-crosshair']"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </span>
                </label>
                <label v-else-if="activeBrowserWait.condition === 'url'">
                    <span>{{ t('browserWait.urlValue') }}</span>
                    <input
                        v-model="activeBrowserWait.value"
                        type="text"
                        data-testid="browser-wait-url"
                        spellcheck="false"
                        @input="markActiveNodeStale"
                    />
                </label>
                <label v-else>
                    <span>{{ t('browserWait.scriptSource') }}</span>
                    <textarea
                        v-model="activeBrowserWait.script"
                        data-testid="browser-wait-script"
                        spellcheck="false"
                        @input="markActiveNodeStale"
                    ></textarea>
                </label>
                <label>
                    <span>{{ t('browser.timeout') }}</span>
                    <input
                        v-model.number="activeBrowserWait.timeoutMs"
                        type="number"
                        min="1"
                        step="1000"
                        data-testid="browser-wait-timeout"
                        @input="markActiveNodeStale"
                    />
                </label>
                <label class="automation-properties__toggle">
                    <input
                        v-model="activeBrowserWait.omitFromRecording"
                        type="checkbox"
                        data-testid="browser-wait-omit-from-recording"
                        @change="markActiveNodeStale"
                    />
                    <span>{{ t('browserWait.omitFromRecording') }}</span>
                </label>
            </div>
            <div v-else-if="activeWebsite" class="website-properties">
                <label for="website-url">{{ t('website.url') }}</label>
                <input
                    id="website-url"
                    :value="activeWebsite.url"
                    type="url"
                    inputmode="url"
                    autocomplete="url"
                    data-testid="website-url"
                    :placeholder="t('website.urlPlaceholder')"
                    @input="updateWebsiteUrl"
                />
                <p>{{ t('website.frameHint') }}</p>
            </div>
            <div v-else-if="activeInput" class="project-inputs">
                <div class="project-input">
                    <label>
                        <span>{{ t('project.inputId') }}</span>
                        <input :value="activeInput.id" type="text" spellcheck="false" readonly />
                    </label>
                    <label>
                        <span>{{ t('project.inputAccept') }}</span>
                        <span class="tag-combobox">
                            <span
                                v-for="value in inputAcceptValues(activeInput)"
                                :key="value"
                                class="tag-pill"
                            >
                                {{ value }}
                                <button
                                    type="button"
                                    :aria-label="t('project.removeInputAccept', { value })"
                                    @click="removeInputAccept(activeInput, value)"
                                >
                                    <i class="bi bi-x" aria-hidden="true"></i>
                                </button>
                            </span>
                            <input
                                v-model="inputAcceptQueries[activeInput.id]"
                                type="text"
                                role="combobox"
                                autocomplete="off"
                                spellcheck="false"
                                :data-testid="`project-input-${activeInput.id}-accept`"
                                :aria-expanded="String(activeInputAcceptId === activeInput.id)"
                                :aria-controls="`project-input-${activeInput.id}-accept-options`"
                                :placeholder="t('project.inputAcceptPlaceholder')"
                                @focus="focusInputAccept(activeInput.id)"
                                @input="focusInputAccept(activeInput.id)"
                                @blur="blurInputAccept(activeInput.id)"
                                @keydown="handleInputAcceptKeydown(activeInput, $event)"
                            />
                            <span
                                v-if="
                                                activeInputAcceptId === activeInput.id &&
                                                inputAcceptSuggestions(activeInput).length
                                            "
                                :id="`project-input-${activeInput.id}-accept-options`"
                                class="tag-suggestions"
                                role="listbox"
                            >
                                <button
                                    v-for="suggestion in inputAcceptSuggestions(activeInput)"
                                    :key="suggestion"
                                    type="button"
                                    role="option"
                                    @mousedown.prevent
                                    @click="addInputAccept(activeInput, suggestion)"
                                >
                                    {{ suggestion }}
                                </button>
                            </span>
                        </span>
                    </label>
                    <label class="project-input__required">
                        <input
                            v-model="activeInput.required"
                            type="checkbox"
                            :data-testid="`project-input-${activeInput.id}-required`"
                            @change="markExecutionDirty"
                        />
                        <span>{{ t('project.inputRequiredToggle') }}</span>
                    </label>
                    <label>
                        <span>{{ t('project.inputValue') }}</span>
                        <input
                            :data-testid="`project-input-${activeInput.id}`"
                            type="file"
                            :accept="activeInput.accept"
                            @change="updateInputFile(activeInput.id, $event)"
                        />
                    </label>
                    <div class="project-preparations">
                        <span>{{ t('project.prepareModules') }}</span>
                        <div
                            v-for="(module, index) in activeInput.prepare?.modules ?? []"
                            :key="`${activeInput.id}-${index}`"
                            class="project-preparation"
                        >
                            <input
                                :value="module"
                                type="text"
                                spellcheck="false"
                                :data-testid="`project-input-${activeInput.id}-prepare-module-${index}`"
                                :aria-label="t('project.prepareModule')"
                                :placeholder="t('project.prepareModulePlaceholder')"
                                @input="updateInputPreparation(activeInput.id, index, $event)"
                            />
                            <button
                                class="icon-button icon-button--small"
                                type="button"
                                :data-testid="`project-input-${activeInput.id}-remove-prepare-module-${index}`"
                                :aria-label="t('project.removePrepareModule')"
                                @click="removeInputPreparation(activeInput.id, index)"
                            >
                                <i class="bi bi-x-lg" aria-hidden="true"></i>
                            </button>
                        </div>
                        <button
                            class="text-action"
                            type="button"
                            :data-testid="`project-input-${activeInput.id}-add-prepare-module`"
                            @click="addInputPreparation(activeInput.id)"
                        >
                            <i class="bi bi-plus-lg" aria-hidden="true"></i>
                            {{ t('project.addPrepareModule') }}
                        </button>
                    </div>
                </div>
            </div>
            <div v-else-if="activeCapability" class="capability-properties">
                <p>{{ t('capability.cameraHint') }}</p>
            </div>
        </div>
    </section>
</template>
